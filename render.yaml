services:
  - type: web
    name: poligo-terminal-runner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: TERMINAL_SANDBOX
        value: chroot-seccomp
      - key: RUNNER_TOKEN
        sync: false
      - key: TERMINAL_RUN_ROOT
        value: /tmp/poligo-terminal-sessions
      - key: TERMINAL_MAX_SESSIONS
        value: "2"
      - key: TERMINAL_IDLE_TTL_MS
        value: "1800000"
      - key: TERMINAL_MAX_LIFETIME_MS
        value: "3600000"
      - key: TERMINAL_MAX_FILES
        value: "200"
      - key: TERMINAL_MAX_PROJECT_BYTES
        value: "5000000"
      - key: TERMINAL_MAX_WORKSPACE_BYTES
        value: "134217728"
      - key: TERMINAL_MAX_WORKSPACE_ENTRIES
        value: "5000"
